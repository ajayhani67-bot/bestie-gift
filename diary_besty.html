<!doctype html>
<html lang="ku" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دیارییەکەت 💗</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
background:linear-gradient(135deg,#ffd6e7,#fff0f6);font-family:Arial,sans-serif}
.card{background:#fff8fc;padding:34px 25px;border-radius:28px;text-align:center;
box-shadow:0 10px 35px #d98aaa55;max-width:420px;margin:20px}
h1{color:#e85d91;font-size:30px}
p{color:#6d3d50;font-size:21px;line-height:1.9}
.heart{font-size:48px;animation:pulse 1.3s infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
</style>
</head>
<body>
<div class="card">
<div class="heart">💗</div>
<h1>بۆ بێستییەکەم 🥹🦋</h1>
<p>
خۆشم ئەوێی زۆر زۆر 💕<br>
تۆ یەکێکیت لە جوانترین دیارییەکانی ژیانم 🫂🥰<br>
ئێستا ئاش بەرۆ، دڵم پێی خۆشە کە ئارام بیت 😌🌙<br>
شەوی خۆشت بێت، بێستییەکەم 💋💗
</p>
<div>🦋💕🥰💕🦋</div>
</div>
</body>
</html>
